services:
  monolith:
    image: ${DOCKER_USERNAME}/keeping-monolith:latest
    container_name: keeping-monolith
    ports:
      - "8080:8080"
    environment:
      # 부하테스트 백도어(X-Test-User-Id 헤더 인증)를 쓰려면 loadtest 프로필이 필요하다.
      # 측정 종료 후 반드시 prod 단독으로 되돌릴 것.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ssafy_fintech_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN}
      - FE_BASE_URL=${FE_BASE_URL:-http://localhost:3030}
      # qr-service는 다른 EC2. 반드시 qr EC2 Private IP:8081로 설정 (미설정 시 캐시 동기화 깨짐)
      - QR_SERVICE_URL=${QR_SERVICE_URL}
      - QR_WEBHOOK_ENABLED=${QR_WEBHOOK_ENABLED:-true}

      # ---------------------------------------------------------------------
      # 부하테스트 백도어 (⚠️ 운영에서는 반드시 false)
      # ---------------------------------------------------------------------
      - LOADTEST_BACKDOOR_ENABLED=${LOADTEST_BACKDOOR_ENABLED:-false}

      # ---------------------------------------------------------------------
      # 측정 통제변인 (Spring relaxed binding으로 yml을 오버라이드. 코드 수정 없음)
      # ---------------------------------------------------------------------
      # 톰캣 스레드 수. yml에 설정이 없어 Spring 기본 200으로 동작하던 값.
      #   200 = 기본 / 20 = 스레드풀 포화를 강제하는 통제변인
      # 적용 확인: GET /actuator/metrics/tomcat.threads.config.max
      - SERVER_TOMCAT_THREADS_MAX=${SERVER_TOMCAT_THREADS_MAX:-200}

      # Hikari 풀 크기. application-prod.yml에 20이 하드코딩되어 있다(플레이스홀더 없음).
      # 톰캣 200 : DB 20 = 10:1 이라 그대로 재면 병목이 DB로 나오는 게 자명하다.
      #   20 = 현행 / 60 = 확대. 20→60에서 병목이 옮겨가는지가 Q1의 핵심 근거.
      # 적용 확인: GET /actuator/metrics/hikaricp.connections.max
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-20}

      # 최초 1회 스키마 생성 시에만 update. 이후 validate 로 되돌릴 것.
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      # ---------------------------------------------------------------------
      # 분산추적 비활성화 — 측정 오염원이라 끈다
      #   (1) Zipkin 서버가 없어 flush마다 ConnectException + 로그 폭주
      #   (2) monolith는 prod 프로필이라 샘플링 0.1인데 qr-service는 base 그대로 1.0 →
      #       두 서비스의 오버헤드가 비대칭이라 비교가 오염된다
      # 측정에서 껐다는 사실은 result.md 에 기록할 것.
      - MANAGEMENT_TRACING_ENABLED=${MANAGEMENT_TRACING_ENABLED:-false}
      # Tomcat ThreadPool MBean 등록 — 이게 없으면 tomcat_threads_* 지표가 통째로 안 나온다.
      # Spring Boot 기본값이 false 라서, 켜지 않으면
      #   tomcat_sessions_* 만 나오고 tomcat_threads_busy / _config_max 는 없다.
      #   → Q1("병목이 DB인가 톰캣 스레드인가 CPU인가")의 세 후보 중 하나를 못 본다.
      #   → SERVER_TOMCAT_THREADS_MAX 가 실제로 먹었는지 검증할 방법도 사라진다.
      # 양쪽 서비스·양쪽 구성에 동일하게 적용하므로 비교에는 편향을 주지 않는다.
      - SERVER_TOMCAT_MBEANREGISTRY_ENABLED=true

      # ---------------------------------------------------------------------
      # v3 후속 — PIN 세션 토큰 (커밋 e201660)
      #   토큰 1개로 결제 여러 건. 1차의 intent 단위 토큰은 Argon2 횟수를 못 줄여
      #   "이동이지 개선이 아니다" 판정을 받았다 (result.md §7-4 ③).
      #
      #   ★ RATE_LIMIT 만 기본 true 다 — 보안 기능이지 성능 기능이 아니다.
      #     측정 편의로 끄지 말 것. verify-token 은 PIN 만 맞으면 무제한 Argon2 를
      #     태울 수 있는 엔드포인트다.
      # ---------------------------------------------------------------------
      - PAYMENT_PIN_SESSION_TOKEN_ENABLED=${PAYMENT_PIN_SESSION_TOKEN_ENABLED:-false}
      - PAYMENT_PIN_SESSION_TOKEN_TTL_SECONDS=${PAYMENT_PIN_SESSION_TOKEN_TTL_SECONDS:-180}
      - PAYMENT_PIN_SESSION_TOKEN_MAX_USES=${PAYMENT_PIN_SESSION_TOKEN_MAX_USES:-5}
      - PAYMENT_PIN_SESSION_TOKEN_MAX_AMOUNT_PER_USE=${PAYMENT_PIN_SESSION_TOKEN_MAX_AMOUNT_PER_USE:-100000}
      - PAYMENT_PIN_SESSION_TOKEN_MAX_AMOUNT_TOTAL=${PAYMENT_PIN_SESSION_TOKEN_MAX_AMOUNT_TOTAL:-300000}
      - PAYMENT_PIN_RATE_LIMIT_ENABLED=${PAYMENT_PIN_RATE_LIMIT_ENABLED:-true}
      - PAYMENT_PIN_RATE_LIMIT_PER_MINUTE=${PAYMENT_PIN_RATE_LIMIT_PER_MINUTE:-10}

      # ── v3 Kafka 컨슈머 (#53) ───────────────────────────────────────────
      #   기본값 = 컨슈머 꺼짐. .env 를 비워도 기존 동작 유지.
      #   Kafka 전환: NOTIFICATION_KAFKA_CONSUMER_ENABLED=true + KAFKA_BOOTSTRAP_SERVERS 설정
      - NOTIFICATION_KAFKA_CONSUMER_ENABLED=${NOTIFICATION_KAFKA_CONSUMER_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - keeping-network

  mysql:
    image: mysql:8.0
    container_name: keeping-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=ssafy_fintech_db
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - keeping-network

  redis:
    image: redis:7-alpine
    container_name: keeping-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keeping-network


  # ---------------------------------------------------------------------------
  # mysqld_exporter — "MySQL 이 왜 못 받는가"에 답하기 위한 계측
  # ---------------------------------------------------------------------------
  #  측정 내내 병목은 이 서비스의 DB 였다(result.md 4장/9장/10장).
  #    Hikari pending 132~183 · active 20/20 · tomcat 200/200
  #  그런데 풀을 20 -> 60 으로 3배 늘렸더니 처리량이 3.2% 나빠졌다.
  #  즉 커넥션이 부족한 게 아니라, 커넥션을 받아도 MySQL 이 일을 못 끝낸다는 뜻인데
  #  MySQL 이 그 시간에 무엇을 하고 있었는지 볼 방법이 없었다.
  #
  #  이 exporter 가 답할 후보 4가지:
  #    슬로우 쿼리   mysql_global_status_slow_queries
  #    락 대기       mysql_global_status_innodb_row_lock_waits / _time_avg
  #    버퍼풀 미스   innodb_buffer_pool_reads vs innodb_buffer_pool_read_requests
  #    커밋 fsync    mysql_global_status_innodb_data_fsyncs
  #
  #  주의: 이 컨테이너가 붙기 전/후는 측정 환경이 다르다.
  #        이번 러닝은 진단용이며 F6/F7 과 절대값을 비교하지 않는다.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: keeping-mysqld-exporter
    environment:
      # v0.15.x 는 DATA_SOURCE_NAME 을 계속 지원한다(deprecated 지만 동작).
      # 실패하면 --config.my-cnf 방식으로 바꿀 것.
      - DATA_SOURCE_NAME=root:${MYSQL_ROOT_PASSWORD}@(mysql:3306)/
    command:
      - --collect.global_status
      - --collect.global_variables
      - --collect.info_schema.innodb_metrics
      - --collect.info_schema.processlist
      - --collect.perf_schema.tablelocks
      - --collect.perf_schema.eventswaits
      - --collect.perf_schema.indexiowaits
      - --collect.perf_schema.tableiowaits
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - keeping-network

volumes:
  mysql_data:
  redis_data:

networks:
  keeping-network:
    driver: bridge
