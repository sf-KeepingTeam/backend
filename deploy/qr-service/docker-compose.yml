services:
  qr-service:
    image: ${DOCKER_USERNAME}/keeping-qr-service:latest
    container_name: keeping-qr-service
    ports:
      - "8081:8081"
    environment:
      - MONOLITH_URL=http://${MONOLITH_HOST}:8080
      - DB_URL=jdbc:mysql://mysql:3306/payment_service?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN}
      - LOADTEST_BACKDOOR_ENABLED=${LOADTEST_BACKDOOR_ENABLED:-false}
      - HIKARI_MAX_POOL_SIZE=${HIKARI_MAX_POOL_SIZE:-15}

      # ---------------------------------------------------------------------
      # 캐시 모드 — 측정 구성 B/C를 가르는 핵심 변수
      #   NONE          = 구성 B (매번 monolith에 Store/Menu 조회)
      #   WRITE_THROUGH = 구성 C (현재 구조. webhook으로 qr-redis에 밀어넣음)
      #   CACHE_ASIDE   = (미사용)
      # ⚠️ 이 변수가 compose에 없어서 .env만 고쳐도 컨테이너에 전달되지 않던 문제 수정.
      # ---------------------------------------------------------------------
      - CACHE_MODE=${CACHE_MODE:-WRITE_THROUGH}
      - CACHE_WARMING_ENABLED=${CACHE_WARMING_ENABLED:-true}

      # 부하테스트 백도어를 쓰려면 프로필이 필요하다 (기본은 application.yml의 docker 설정).
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}

      # 측정 통제변인 — 적용 확인: GET /actuator/metrics/tomcat.threads.config.max
      - SERVER_TOMCAT_THREADS_MAX=${SERVER_TOMCAT_THREADS_MAX:-200}
      # ---------------------------------------------------------------------
      # 분산추적 비활성화 — 측정 오염원이라 끈다
      #   (1) Zipkin 서버가 없어 flush마다 ConnectException + 로그 폭주
      #   (2) monolith는 prod 프로필이라 샘플링 0.1인데 qr-service는 base 그대로 1.0 →
      #       두 서비스의 오버헤드가 비대칭이라 비교가 오염된다
      # 측정에서 껐다는 사실은 result.md 에 기록할 것.
      - MANAGEMENT_TRACING_ENABLED=${MANAGEMENT_TRACING_ENABLED:-false}
      # Tomcat ThreadPool MBean 등록 — 이게 없으면 tomcat_threads_* 지표가 통째로 안 나온다.
      # Spring Boot 기본값이 false 라서, 켜지 않으면
      #   tomcat_sessions_* 만 나오고 tomcat_threads_busy / _config_max 는 없다.
      #   → Q1("병목이 DB인가 톰캣 스레드인가 CPU인가")의 세 후보 중 하나를 못 본다.
      #   → SERVER_TOMCAT_THREADS_MAX 가 실제로 먹었는지 검증할 방법도 사라진다.
      # 양쪽 서비스·양쪽 구성에 동일하게 적용하므로 비교에는 편향을 주지 않는다.
      - SERVER_TOMCAT_MBEANREGISTRY_ENABLED=true

      # ---------------------------------------------------------------------
      # v3 개선 플래그 (측정용 — 한 번에 하나만 켤 것)
      #   기본값을 false 로 둔 이유: 아무것도 안 건드리면 v2 동작(=비교 기준선)이 된다.
      #   운영 기본값은 application.yml 에서 true 다. 여기서는 측정 통제를 위해 명시 오버라이드.
      #
      #   PAYMENT_NOTIFICATION_ASYNC          알림을 커밋 후 비동기 발송
      #   PAYMENT_APPROVE_SPLIT_TRANSACTION   approve 를 TX-A / NO-TX / TX-B 로 분리
      #   PAYMENT_PIN_TOKEN_ENABLED           PIN 토큰 로컬 검증 (monolith 왕복 제거)
      #     ⚠️ 이걸 true 로 재려면 k6 도 PIN_MODE=token 이어야 한다.
      #        안 그러면 ApproveRequest.pinToken 이 비어 토큰 경로를 안 탄다.
      # ---------------------------------------------------------------------
      - PAYMENT_NOTIFICATION_ASYNC=${PAYMENT_NOTIFICATION_ASYNC:-false}
      - PAYMENT_APPROVE_SPLIT_TRANSACTION=${PAYMENT_APPROVE_SPLIT_TRANSACTION:-false}
      - PAYMENT_PIN_TOKEN_ENABLED=${PAYMENT_PIN_TOKEN_ENABLED:-false}

      # ── v3 Kafka 아웃박스 (#50~#53) ──────────────────────────────────────
      #   기본값 = HTTP 경로. .env 를 비워도 기존 동작 유지.
      #   Kafka 전환: PAYMENT_NOTIFICATION_TRANSPORT=kafka + PAYMENT_OUTBOX_ENABLED=true
      - PAYMENT_NOTIFICATION_TRANSPORT=${PAYMENT_NOTIFICATION_TRANSPORT:-http}
      - PAYMENT_OUTBOX_ENABLED=${PAYMENT_OUTBOX_ENABLED:-false}
      - PAYMENT_OUTBOX_POLL_INTERVAL_MS=${PAYMENT_OUTBOX_POLL_INTERVAL_MS:-500}
      - PAYMENT_OUTBOX_BATCH_SIZE=${PAYMENT_OUTBOX_BATCH_SIZE:-100}
      - PAYMENT_OUTBOX_MAX_RETRY=${PAYMENT_OUTBOX_MAX_RETRY:-10}
      - PAYMENT_OUTBOX_RETENTION_DAYS=${PAYMENT_OUTBOX_RETENTION_DAYS:-7}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}

      # ── v3 후속 — 세션 토큰 폐기 확인 ────────────────────────────────────
      #   ⚠️ monolith 와 qr 이 같은 Redis 를 볼 때만 동작한다.
      #      2-EC2 배포에서는 keeping-redis / qr-redis 로 별개일 가능성이 높다.
      #      환경변수 문자열 비교로 판단하지 말 것 (둘 다 'redis' 로 찍혀 오탐한다).
      #      실제 프로브로 확인하고, 별개면 false 로 둔 채
      #      "TTL 이 유일한 방어선"이라고 result.md 에 적는다.
      - PAYMENT_PIN_SESSION_TOKEN_REVOCATION_CHECK=${PAYMENT_PIN_SESSION_TOKEN_REVOCATION_CHECK:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - keeping-network

  mysql:
    image: mysql:8.0
    container_name: qr-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=payment_service
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - keeping-network

  redis:
    image: redis:7-alpine
    container_name: qr-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keeping-network

volumes:
  mysql_data:
  redis_data:

networks:
  keeping-network:
    driver: bridge
