server:
  port: 8081

spring:
  application:
    name: qr-service

  # Redis 설정 (QR 토큰 저장)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # JPA/MySQL 설정
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_service?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:3000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Spring Cache (Redis)
  cache:
    type: redis

# JWT 설정 (모놀리스와 같은 키 사용!)
jwt:
  secret: ${JWT_SECRET:NbPg+8/rCm9yW15pYbbOTXdg1QTPqDcRMA8oauseuOqzrAdkLMcXfmbMLkqt3tZ5HecMd5bnCscx4Iuo2EjnJA==}
  issuer: kakao-oauth2-jwt

# 모놀리스 URL (ACL 호출용)
monolith:
  url: ${MONOLITH_URL:http://localhost:8080}

# 내부 서비스 통신 토큰
internal:
  auth-token: ${INTERNAL_AUTH_TOKEN:internal-service-token-12345}

# 캐시 모드 및 워밍 설정
cache:
  # 캐시 모드: NONE / CACHE_ASIDE / WRITE_THROUGH
  mode: ${CACHE_MODE:WRITE_THROUGH}
  warming:
    enabled: ${CACHE_WARMING_ENABLED:true}

# NOTE: 아래 management / logging.pattern 블록은 monolith/src/main/resources/application.yml 와
#       수동 동기화 대상. 한쪽만 수정하지 말 것. (독립 Gradle 프로젝트라 YAML 공유 불가)
# Actuator + Tracing
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0  # 100% 샘플링 (개발용, 운영에서는 0.1 권장)
    enabled: true
  zipkin:
    tracing:
      enabled: false  # Zipkin 서버 없이 로그 기반 추적

# OpenAPI 문서화
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 로깅 (TraceId 포함)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Slack 알림
slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

# 결제 튜닝 (PaymentTuningProperties)
payment:
  notification:
    async: true
  approve:
    split-transaction: true
  pin:
    token-enabled: true
    token-ttl-seconds: 60

# 로드테스트 백도어 (테스트용)
loadtest:
  backdoor:
    enabled: ${LOADTEST_BACKDOOR_ENABLED:false}

# RestTemplate 타임아웃 (용도별 분리)
rest-template:
  connect-timeout: 3000   # 3초 (기존 10초)
  read-timeout: 5000      # 5초 (기존 30초)

rest-template-write:
  connect-timeout: 2000   # 2초
  read-timeout: 3000      # 3초 (Fail-Fast)

rest-template-recovery:
  connect-timeout: 5000   # 5초
  read-timeout: 10000     # 10초 (복구는 여유있게)

# 커넥션 풀 (Apache HttpClient5) — 용도별 벌크헤드
rest-template-pool:
  enabled: true                          # false → 풀 없는 SimpleClientHttpRequestFactory 폴백 (A/B 비교)
  # 읽기 풀 (restTemplate — StoreClient, MenuClient, CustomerClient 등)
  read:
    max-per-route: 50
    max-total: 60
    connection-request-timeout: 2000     # 풀에서 연결 대기 한도 (ms)
  # 쓰기 풀 (writeRestTemplate — WalletClient capture/release/refund)
  write:
    max-per-route: 30
    max-total: 30
    connection-request-timeout: 500      # Fail-Fast
  # 복구 풀 (recoveryRestTemplate — PaymentRecoveryService)
  recovery:
    max-per-route: 10
    max-total: 10
    connection-request-timeout: 2000
  # Slack webhook 전용 (외부 호스트 격리)
  slack:
    connect-timeout: 2000
    read-timeout: 3000
    max-per-route: 5
    max-total: 5
    connection-request-timeout: 500
  # 공통
  validate-after-inactivity: 5000        # 유휴 후 연결 유효성 검사 (ms)
  evict-idle: 30000                      # 유휴 연결 제거 주기 (ms)
  time-to-live: 300000                   # 연결 최대 수명 (ms, 5분)

# Resilience4j 설정
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      strict:  # WalletClient용 (엄격)
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 40
        waitDurationInOpenState: 30s  # 기존 60s → 30s
        # 장애는 '실패'가 아니라 '느려짐'으로 시작한다. 실패로 확정되기(타임아웃) 전 단계에서
        # 선제 차단해, 워커 스레드가 응답 대기로 묶이는 것 자체를 막는다.
        # 2s  : rest-template-write.read-timeout(3s)보다 짧게 — 타임아웃 누적 전에 감지.
        # 50% : 느림은 실패보다 약한 신호라 failureRateThreshold(40%)보다 관대하게 잡아
        #       일시적 지연에 과민 반응하지 않도록 함.
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
      lenient:  # NotificationClient용 (관대)
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 15s
      recovery:  # 복구용 (여유있는 설정)
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
    instances:
      walletClient:
        baseConfig: strict
      walletClientRecovery:
        baseConfig: recovery
      customerClient:
        baseConfig: default
      storeClient:
        baseConfig: default
      menuClient:
        baseConfig: default
      notificationClient:
        baseConfig: lenient

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
      strict:  # WalletClient 쓰기용 (재시도 없음 - Fail-Fast)
        maxAttempts: 1
        waitDuration: 0ms
      lenient:  # NotificationClient용
        maxAttempts: 2
        waitDuration: 200ms
      recovery:  # 복구용 (재시도 허용)
        maxAttempts: 3
        waitDuration: 2000ms
    instances:
      walletClient:
        baseConfig: strict
      walletClientReadOnly:
        baseConfig: default
      walletClientRecovery:
        baseConfig: recovery
      customerClient:
        baseConfig: default
      storeClient:
        baseConfig: default
      menuClient:
        baseConfig: default
      notificationClient:
        baseConfig: lenient
